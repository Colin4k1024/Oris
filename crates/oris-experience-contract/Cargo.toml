[package]
name = "oris-experience-contract"
version = "0.1.0"
edition = "2021"
description = "Canonical cross-agent experience contract for Oris"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
