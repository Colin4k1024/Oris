[package]
name = "oris-experience-contract"
version = "0.1.0"
edition = "2021"
description = "Canonical cross-agent experience contract for Oris"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Colin4k1024/Oris"
documentation = "https://docs.rs/oris-experience-contract"
homepage = "https://github.com/Colin4k1024/Oris"
keywords = ["oris", "experience", "agent", "contract"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
